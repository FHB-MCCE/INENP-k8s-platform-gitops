name: Validate Manifests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

  kubeconform:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate manifests
        run: |
          find . -name '*.yaml' -o -name '*.yml' | \
            grep -v '.github/' | \
            grep -v '.yamllint' | \
            xargs -r kubeconform -strict -ignore-missing-schemas -summary || true

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Lint Helm charts
        run: |
          charts=$(find . -name 'Chart.yaml' -printf '%h\n' 2>/dev/null)
          if [ -n "$charts" ]; then
            echo "$charts" | xargs -I{} helm lint {}
          else
            echo "No Helm charts found, skipping."
          fi
