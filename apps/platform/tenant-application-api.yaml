---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-application-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: tenant-application-api
    app.kubernetes.io/part-of: inenp-platform
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/FHB-MCCE/INENP-k8s-platform-gitops.git
    targetRevision: main
    path: platform/crossplane
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
