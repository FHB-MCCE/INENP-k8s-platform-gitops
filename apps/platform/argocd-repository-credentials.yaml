apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-repository-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  labels:
    app.kubernetes.io/name: argocd-repository-credentials
    app.kubernetes.io/part-of: inenp-platform
spec:
  project: default
  source:
    repoURL: https://github.com/FHB-MCCE/INENP-k8s-platform-gitops.git
    targetRevision: main
    path: infrastructure/argocd-repository-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
